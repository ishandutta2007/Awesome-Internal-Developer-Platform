th stroke="#bc8cff" d="M 100,220 Q 350,180 600,240 T 1100,210" class="flow-line"/></g><g opacity=".35"><g class="floating-1"><circle cx="140" cy="90" r="24" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><polygon fill="none" stroke="#58a6ff" stroke-width="2" points="140 76 152 98 128 98"/></g><g class="floating-2"><circle cx="1060" cy="80" r="28" fill="#161b22" stroke="#3fb950" stroke-width="2"/><rect width="24" height="24" x="1048" y="68" fill="none" stroke="#3fb950" stroke-width="2" rx="4"/></g><g class="floating-3"><circle cx="1080" cy="220" r="22" fill="#161b22" stroke="#bc8cff" stroke-width="2"/><circle cx="1080" cy="220" r="10" fill="none" stroke="#bc8cff" stroke-width="2"/></g><g class="floating-1"><circle cx="120" cy="210" r="26" fill="#161b22" stroke="#f0883e" stroke-width="2"/><path stroke="#f0883e" stroke-width="2" d="M110,210 L130,210 M120,200 L120,220"/></g></g><g filter="url(#shadow)" text-anchor="middle"><g transform="translate(600, 65)"><rect width="60" height="60" x="-30" y="-30" fill="#1f6feb" fill-opacity=".2" stroke="#58a6ff" stroke-width="2" rx="16"/><path fill="none" stroke="#58a6ff" stroke-width="2.5" d="M-12,-10 L0,-20 L12,-10 L12,10 L0,20 L-12,10 Z"/><path stroke="#bc8cff" stroke-width="1.5" d="M0,-20 L0,20 M-12,-10 L12,10 M-12,10 L12,-10"/></g><text x="600" y="155" class="title">Awesome Internal Developer Platform</text><text x="600" y="195" class="subtitle">Curated Ecosystem of IDP Tools, Portals, Orchestrators &amp; Platform Engineering</text></g><g text-anchor="middle"><g transform="translate(600, 245) translate(-180, 0)"><rect width="140" height="28" x="-70" y="-14" fill="#21262d" stroke="#30363d" rx="14"/><text x="0" y="5" fill="#58a6ff" class="badge-text">🚀 Developer Portals</text></g><g transform="translate(600, 245) translate(0, 0)"><rect width="170" height="28" x="-85" y="-14" fill="#21262d" stroke="#30363d" rx="14"/><text x="0" y="5" fill="#bc8cff" class="badge-text">⚡ Platform Orchestration</text></g><g transform="translate(60