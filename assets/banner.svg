<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#bc8cff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 46px; font-weight: 800; fill: url(#text-grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 20px; font-weight: 400; fill: #8b949e; }
    .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #c9d1d9; }
    
    /* SVG Animations */
    @keyframes pulse-glow {
      0% { transform: scale(0.95); opacity: 0.3; }
      50% { transform: scale(1.1); opacity: 0.6; }
      100% { transform: scale(0.95); opacity: 0.3; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -100; }
    }
    @keyframes float-node {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }

    .glowing-bg { transform-origin: center; animation: pulse-glow 6s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8 6; animation: dash 5s linear infinite; }
    .floating-1 { animation: float-node 4s ease-in-out infinite; }
    .floating-2 { animation: float-node 5s ease-in-out infinite 1s; }
    .floating-3 { animation: float-node 4.5s ease-in-out infinite 0.5s; }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)" stroke="#30363d" stroke-width="2"/>
  <circle cx="600" cy="150" r="350" fill="url(#glow)" class="glowing-bg" />

  <!-- Background Dynamic Network Connections (Subtle behind text) -->
  <g stroke="#30363d" stroke-width="1.5" fill="none" opacity="0.4">
    <path d="M 150,80 Q 300,120 450,70 T 750,100 T 1050,60" class="flow-line" stroke="#58a6ff"/>
    <path d="M 100,220 Q 350,180 600,240 T 1100,210" class="flow-line" stroke="#bc8cff"/>
  </g>

  <!-- Floating Dynamic Tech Nodes in Background -->
  <g opacity="0.35">
    <g class="floating-1">
      <circle cx="140" cy="90" r="24" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
      <polygon points="140,76 152,98 128,98" fill="none" stroke="#58a6ff" stroke-width="2"/>
    </g>
    <g class="floating-2">
      <circle cx="1060" cy="80" r="28" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
      <rect x="1048" y="68" width="24" height="24" rx="4" fill="none" stroke="#3fb950" stroke-width="2"/>
    </g>
    <g class="floating-3">
      <circle cx="1080" cy="220" r="22" fill="#161b22" stroke="#bc8cff" stroke-width="2"/>
      <circle cx="1080" cy="220" r="10" fill="none" stroke="#bc8cff" stroke-width="2"/>
    </g>
    <g class="floating-1">
      <circle cx="120" cy="210" r="26" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
      <path d="M110,210 L130,210 M120,200 L120,220" stroke="#f0883e" stroke-width="2"/>
    </g>
  </g>

  <!-- Foreground Title and Subtitle Layer (Guaranteed Crisp & Unobstructed) -->
  <g filter="url(#shadow)" text-anchor="middle">
    <!-- Icon / Symbol -->
    <g transform="translate(600, 65)">
      <rect x="-30" y="-30" width="60" height="60" rx="16" fill="#1f6feb" fill-opacity="0.2" stroke="#58a6ff" stroke-width="2"/>
      <path d="M-12,-10 L0,-20 L12,-10 L12,10 L0,20 L-12,10 Z" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
      <path d="M0,-20 L0,20 M-12,-10 L12,10 M-12,10 L12,-10" stroke="#bc8cff" stroke-width="1.5"/>
    </g>

    <!-- Main Title -->
    <text x="600" y="155" class="title">Awesome Internal Developer Platform</text>
    
    <!-- Subtitle -->
    <text x="600" y="195" class="subtitle">Curated Ecosystem of IDP Tools, Portals, Orchestrators &amp; Platform Engineering</text>
  </g>

  <!-- Bottom Pill Badges in Banner -->
  <g transform="translate(600, 245)" text-anchor="middle">
    <!-- Badge 1 -->
    <g transform="translate(-180, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="0" y="5" class="badge-text" fill="#58a6ff">🚀 Developer Portals</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="0" y="5" class="badge-text" fill="#bc8cff">⚡ Platform Orchestration</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(180, 0)">
      <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#21262d" stroke="#30363d"/>
      <text x="0" y="5" class="badge-text" fill="#3fb950">🛠️ GitOps &amp; CI/CD</text>
    </g>
  </g>
</svg>
